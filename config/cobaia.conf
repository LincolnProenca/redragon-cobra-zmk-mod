# ==========================================
# BASE SUBSYSTEMS
# ==========================================
# Required in recent ZMK versions for pointing devices to work
CONFIG_INPUT=y
CONFIG_SPI=y

# ==========================================
# MOUSE AND SENSOR (PMW3610 ALT)
# ==========================================
CONFIG_BT_DEVICE_APPEARANCE=962

CONFIG_ZMK_POINTING=y
# Enables the badjeff driver instead of Zephyr's native driver
CONFIG_PMW3610_ALT=y
# Wireless response time optimization (delay before the sensor reduces the polling rate to save battery)
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=128

# ==========================================
# SCROLL WHEEL (ENCODER)
# ==========================================
# Required for ZMK to read the mouse wheel (declared as ec11 in the overlay)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ==========================================
# BATTERY AND DEEP SLEEP
# ==========================================
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=120
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_PM_SOFT_OFF=y

# ==========================================
# SWITCH DEBOUNCE (NOISE FILTER)
# ==========================================
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=20
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=20

# ==========================================
# POWER AND RGB UNDERGLOW LEDS
# ==========================================
CONFIG_ZMK_EXT_POWER=n

CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=3
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y